name: 🚀 Build and Push to Azure ACR

# El robot se activará cada vez que hagamos un 'push' a la rama 'main'
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar nuestro código al servidor de GitHub
      - name: 📥 Checkout de código
        uses: actions/checkout@v3

      # 2. Iniciar sesión en nuestro Registro de Azure usando los secretos
      - name: 🔑 Login en Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3. Construir la imagen de Docker y subirla a Azure
      - name: 🐳 Build y Push de imagen Docker
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/smart-ticket-router:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/smart-ticket-router:latest